name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Luau
        run: |
          curl -fsSL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.748/luau-ubuntu.zip
          echo "e6905c04dbccaeff54ca4986b0017f125db5aa301bcb34d0446355cbfee5bc83  luau.zip" | sha256sum -c -
          unzip -q luau.zip -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP"/luau/*
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"

      - name: Compile sources
        run: |
          status=0
          while IFS= read -r -d '' file; do
            luau-compile --binary "$file" > /dev/null || status=1
          done < <(find src tests -name '*.lua' -not -path 'tests/.build/*' -print0)
          exit "$status"

      - name: Run tests
        run: |
          python3 tests/build.py
          luau tests/.build/run.lua

      - name: Install Rojo
        run: |
          curl -fsSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          echo "00FEB4FA0829A1DD72B49DF2639DA519A352BFE13CADCD83969E2BA2BB5693C4  rojo.zip" | sha256sum -c -
          unzip -q rojo.zip -d "$RUNNER_TEMP/rojo"
          chmod +x "$RUNNER_TEMP/rojo/rojo"
          echo "$RUNNER_TEMP/rojo" >> "$GITHUB_PATH"

      - name: Build place file
        run: rojo build default.project.json --output FluxNext.rbxl
